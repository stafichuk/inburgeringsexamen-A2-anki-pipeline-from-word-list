llm:
  base_url: "https://example-llm-provider.local/v1/chat/completions"
  api_token: "replace-me"
  model_name: "gpt-4o-mini"
  custom_headers:
    X-Client-Name: "dutch-a2-anki-pipeline"
  timeout_seconds: 60
  max_retries: 2
  retry_backoff_seconds: 1.5
  temperature: 0.2
  # Size this for all currently pending cards in one coordinated response.
  max_tokens: 65536

deck:
  deck_name: "Lesson 3 - De school"
  model_name: "Dutch A2 Inburgering Vocabulary"
  deck_id_seed: "dutch-a2-inburgering"

generation:
  default_topic: "De school"
  default_lesson: "Lesson 3"
  default_exam_level: "A2 Inburgering Spreken"
  json_repair_enabled: true

cache:
  directory: ".cache/cards"

audio:
  enabled: false
  provider: "azure"
  directory: ".cache/audio"
  azure:
    region: "westeurope"
    # endpoint: "https://westeurope.tts.speech.microsoft.com/cognitiveservices/v1"
    api_key: "replace-me"
    voice: "nl-NL-FennaNeural"

logging:
  level: "INFO"
